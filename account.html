<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>الحساب - Red Sea</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: #070b12;
      color: #fff;
      font-family: Arial, Tahoma, sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      background: #070b12;
      padding-bottom: 30px;
    }

    /* TOP BAR */

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #0d121b;
      border-bottom: 1px solid #1b2431;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 13px;
      background: #151d28;
      color: #fff;
      font-size: 23px;
      cursor: pointer;
    }

    .title {
      font-size: 19px;
      font-weight: bold;
    }

    .logo-mini {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      object-fit: cover;
      background: #151d28;
    }

    /* PROFILE */

    .profile {
      margin: 18px 15px 12px;
      padding: 22px 16px;
      border-radius: 22px;
      background: linear-gradient(145deg, #111923, #0c1119);
      border: 1px solid #202b38;
      text-align: center;
    }

    .avatar-wrap {
      position: relative;
      width: 92px;
      height: 92px;
      margin: auto;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      background: #161f2b;
      border: 3px solid #d71920;
    }

    .online {
      position: absolute;
      width: 17px;
      height: 17px;
      background: #19d66b;
      border: 3px solid #0d121b;
      border-radius: 50%;
      bottom: 3px;
      right: 4px;
    }

    .username {
      margin-top: 13px;
      font-size: 23px;
      font-weight: bold;
    }

    .userid {
      margin-top: 7px;
      color: #8995a5;
      font-size: 14px;
      direction: ltr;
    }

    .edit-profile {
      margin-top: 17px;
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 13px;
      background: #d71920;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .edit-profile:active,
    .logout:active,
    .setting:active {
      transform: scale(.98);
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin: 12px 15px;
    }

    .stat {
      background: #101721;
      border: 1px solid #1c2734;
      border-radius: 17px;
      padding: 15px 7px;
      text-align: center;
    }

    .stat-icon {
      font-size: 22px;
    }

    .stat-value {
      margin-top: 7px;
      font-size: 18px;
      font-weight: bold;
    }

    .stat-label {
      margin-top: 4px;
      color: #8792a2;
      font-size: 12px;
    }

    /* SECTION */

    .section {
      margin: 18px 15px;
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card {
      background: #101721;
      border: 1px solid #1c2734;
      border-radius: 18px;
      overflow: hidden;
    }

    /* INFO */

    .info-row {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 1px solid #1c2734;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-icon {
      width: 39px;
      height: 39px;
      border-radius: 12px;
      background: #171f2b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .info-content {
      flex: 1;
      min-width: 0;
    }

    .info-label {
      color: #7f8b9b;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 15px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* SETTINGS */

    .setting {
      width: 100%;
      min-height: 57px;
      border: 0;
      border-bottom: 1px solid #1c2734;
      background: transparent;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 9px 14px;
      cursor: pointer;
      text-align: right;
    }

    .setting:last-child {
      border-bottom: 0;
    }

    .setting-icon {
      width: 39px;
      height: 39px;
      border-radius: 12px;
      background: #171f2b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      margin-left: 12px;
    }

    .setting-text {
      flex: 1;
      font-size: 15px;
      font-weight: bold;
    }

    .arrow {
      color: #687586;
      font-size: 20px;
    }

    /* LOGOUT */

    .logout {
      width: calc(100% - 30px);
      height: 50px;
      margin: 20px 15px 0;
      border: 1px solid #542027;
      border-radius: 15px;
      background: #1a1014;
      color: #ff5c68;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      color: #596575;
      font-size: 12px;
      margin-top: 22px;
    }

    /* LOADING */

    .loading {
      position: fixed;
      inset: 0;
      background: #070b12;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .loader-box {
      text-align: center;
    }

    .loader {
      width: 42px;
      height: 42px;
      border: 4px solid #242d39;
      border-top-color: #d71920;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: auto;
    }

    .loading-text {
      margin-top: 12px;
      color: #8995a5;
      font-size: 14px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 600px;
      background: #101721;
      border-radius: 24px 24px 0 0;
      border-top: 1px solid #273342;
      padding: 20px 16px 25px;
      animation: up .2s ease;
    }

    @keyframes up {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 17px;
    }

    .input {
      width: 100%;
      height: 49px;
      border: 1px solid #293443;
      background: #0b1119;
      border-radius: 13px;
      color: #fff;
      outline: none;
      padding: 0 14px;
      font-size: 15px;
      margin-bottom: 11px;
      direction: rtl;
    }

    .input:focus {
      border-color: #d71920;
    }

    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 5px;
    }

    .modal-btn {
      height: 46px;
      border-radius: 13px;
      border: 0;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn {
      background: #d71920;
      color: #fff;
    }

    .cancel-btn {
      background: #1b2430;
      color: #fff;
    }

    /* TOAST */

    .toast {
      position: fixed;
      left: 15px;
      right: 15px;
      bottom: 18px;
      max-width: 570px;
      margin: auto;
      padding: 13px 15px;
      border-radius: 14px;
      background: #18212d;
      border: 1px solid #293645;
      color: #fff;
      text-align: center;
      font-size: 14px;
      display: none;
      z-index: 500;
    }

    .toast.show {
      display: block;
      animation: toast .2s ease;
    }

    @keyframes toast {
      from {
        transform: translateY(15px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (min-width: 601px) {
      body {
        background: #020408;
      }

      .app {
        border-left: 1px solid #111923;
        border-right: 1px solid #111923;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <button class="back-btn" onclick="goBack()">‹</button>

    <div class="title">الحساب</div>

    <img
      id="logoMini"
      class="logo-mini"
      src="logo.png"
      alt="Red Sea">
  </div>


  <!-- PROFILE -->
  <div class="profile">

    <div class="avatar-wrap">
      <img
        id="avatar"
        class="avatar"
        src="logo.png"
        alt="صورة الحساب">

      <div class="online"></div>
    </div>

    <div id="username" class="username">
      جاري التحميل...
    </div>

    <div id="userid" class="userid">
      ID: -
    </div>

    <button class="edit-profile" onclick="openEditModal()">
      ✏️ تعديل الملف الشخصي
    </button>

  </div>


  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      <div class="stat-icon">🪙</div>
      <div id="coins" class="stat-value">0</div>
      <div class="stat-label">العملات</div>
    </div>

    <div class="stat">
      <div class="stat-icon">👥</div>
      <div id="followers" class="stat-value">0</div>
      <div class="stat-label">المتابعين</div>
    </div>

    <div class="stat">
      <div class="stat-icon">❤️</div>
      <div id="following" class="stat-value">0</div>
      <div class="stat-label">المتابَعين</div>
    </div>

  </div>


  <!-- ACCOUNT INFO -->
  <div class="section">

    <div class="section-title">
      معلومات الحساب
    </div>

    <div class="card">

      <div class="info-row">

        <div class="info-icon">👤</div>

        <div class="info-content">

          <div class="info-label">
            اسم المستخدم
          </div>

          <div id="infoName" class="info-value">
            -
          </div>

        </div>

      </div>


      <div class="info-row">

        <div class="info-icon">🆔</div>

        <div class="info-content">

          <div class="info-label">
            رقم الحساب
          </div>

          <div id="infoId" class="info-value">
            -
          </div>

        </div>

      </div>


      <div class="info-row">

        <div class="info-icon">📧</div>

        <div class="info-content">

          <div class="info-label">
            البريد الإلكتروني
          </div>

          <div id="infoEmail" class="info-value">
            -
          </div>

        </div>

      </div>


      <div class="info-row">

        <div class="info-icon">🏢</div>

        <div class="info-content">

          <div class="info-label">
            الوكالة
          </div>

          <div id="infoAgency" class="info-value">
            لا توجد وكالة
          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- SETTINGS -->
  <div class="section">

    <div class="section-title">
      الإعدادات
    </div>

    <div class="card">

      <button class="setting" onclick="openEditModal()">

        <div class="setting-icon">
          ✏️
        </div>

        <div class="setting-text">
          تعديل بيانات الحساب
        </div>

        <div class="arrow">
          ‹
        </div>

      </button>


      <button class="setting" onclick="changePassword()">

        <div class="setting-icon">
          🔐
        </div>

        <div class="setting-text">
          تغيير كلمة المرور
        </div>

        <div class="arrow">
          ‹
        </div>

      </button>


      <button class="setting" onclick="copyUserId()">

        <div class="setting-icon">
          🆔
        </div>

        <div class="setting-text">
          نسخ ID الحساب
        </div>

        <div class="arrow">
          ‹
        </div>

      </button>

    </div>

  </div>


  <!-- LOGOUT -->

  <button class="logout" onclick="logout()">
    🚪 تسجيل الخروج
  </button>


  <div class="footer">
    Red Sea
  </div>

</div>


<!-- LOADING -->

<div id="loading" class="loading">

  <div class="loader-box">

    <div class="loader"></div>

    <div class="loading-text">
      جاري تحميل الحساب...
    </div>

  </div>

</div>


<!-- EDIT MODAL -->

<div id="editModal" class="modal">

  <div class="modal-box">

    <div class="modal-title">
      تعديل الملف الشخصي
    </div>

    <input
      id="editName"
      class="input"
      type="text"
      placeholder="اسم المستخدم"
      maxlength="40">

    <input
      id="editAvatar"
      class="input"
      type="text"
      placeholder="رابط صورة الحساب">

    <div class="modal-buttons">

      <button
        class="modal-btn cancel-btn"
        onclick="closeEditModal()">
        إلغاء
      </button>

      <button
        class="modal-btn save-btn"
        onclick="saveProfile()">
        حفظ التعديلات
      </button>

    </div>

  </div>

</div>


<!-- TOAST -->

<div id="toast" class="toast"></div>


<script>

  /* =========================
     FIREBASE
  ========================= */

  const firebaseConfig = {
    apiKey: "AIzaSyD_R-LAa0qHFLSFI7QXJ7mCLnh2DJyZhM",
    authDomain: "red-sea-8db76.firebaseapp.com",
    projectId: "red-sea-8db76",
    storageBucket: "red-sea-8db76.firebasestorage.app",
    messagingSenderId: "418468623324",
    appId: "1:418468623324:web:2a5fd96f353efccaf81519"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();


  /* =========================
     SERVER
  ========================= */

  const API_BASE =
    "https://red-sea-server.onrender.com";


  /* =========================
     DATA
  ========================= */

  let currentUser = null;
  let userData = null;


  /* =========================
     HELPERS
  ========================= */

  function $(id) {
    return document.getElementById(id);
  }


  function showToast(message) {

    const toast = $("toast");

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 2500);

  }


  function clean(value) {

    return String(value || "")
      .trim()
      .replace(/[<>]/g, "");

  }


  function formatNumber(value) {

    const number = Number(value || 0);

    return number.toLocaleString("ar-EG");

  }


  /* =========================
     AUTH
  ========================= */

  auth.onAuthStateChanged(async user => {

    if (!user) {

      window.location.href = "login.html";

      return;
    }

    currentUser = user;

    await loadAccount();

  });


  /* =========================
     LOAD ACCOUNT
  ========================= */

  async function loadAccount() {

    try {

      const uid = currentUser.uid;

      const response = await fetch(
        API_BASE +
        "/api/users/by-firebase/" +
        encodeURIComponent(uid)
      );

      if (!response.ok) {

        throw new Error(
          "فشل تحميل بيانات الحساب"
        );

      }

      userData = await response.json();

      renderAccount();

    } catch (error) {

      console.error(error);

      /*
       * في حالة عدم رجوع بيانات من السيرفر
       * نستخدم بيانات Firebase الأساسية.
       */

      userData = {

        firebaseUid: currentUser.uid,

        name:
          currentUser.displayName ||
          "مستخدم Red Sea",

        email:
          currentUser.email || "",

        avatar:
          currentUser.photoURL || "",

        coins: 0,

        followers: 0,

        following: 0,

        agencyId: null

      };

      renderAccount();

      showToast(
        "تعذر تحميل بعض بيانات الحساب"
      );

    }

    $("loading").style.display = "none";

  }


  /* =========================
     RENDER
  ========================= */

  function renderAccount() {

    const data = userData || {};

    const name =
      data.name ||
      data.username ||
      currentUser.displayName ||
      "مستخدم Red Sea";


    /*
     * ID الحساب
     */

    const accountId =
      data.userId ||
      data.id ||
      data.uid ||
      data.firebaseUid ||
      currentUser.uid;


    /*
     * الصورة
     */

    const avatar =
      data.avatar ||
      data.photoURL ||
      currentUser.photoURL ||
      "logo.png";


    /*
     * بيانات الوكالة
     */

    const agency =
      data.agencyName ||
      data.agency ||
      data.agencyId ||
      "لا توجد وكالة";


    /*
     * البيانات الأساسية
     */

    $("username").textContent = name;

    $("userid").textContent =
      "ID: " + accountId;

    $("avatar").src = avatar;

    $("infoName").textContent = name;

    $("infoId").textContent = accountId;

    $("infoEmail").textContent =
      data.email ||
      currentUser.email ||
      "غير متوفر";

    $("infoAgency").textContent =
      agency;


    /*
     * الإحصائيات
     */

    $("coins").textContent =
      formatNumber(
        data.coins ??
        data.balance ??
        0
      );


    $("followers").textContent =
      formatNumber(
        data.followers ??
        data.followersCount ??
        0
      );


    $("following").textContent =
      formatNumber(
        data.following ??
        data.followingCount ??
        0
      );


    /*
     * الصورة لو الرابط غلط
     */

    $("avatar").onerror = function() {

      this.src = "logo.png";

    };

  }


  /* =========================
     EDIT PROFILE
  ========================= */

  function openEditModal() {

    const data = userData || {};

    $("editName").value =
      data.name ||
      data.username ||
      currentUser.displayName ||
      "";

    $("editAvatar").value =
      data.avatar ||
      data.photoURL ||
      currentUser.photoURL ||
      "";

    $("editModal").classList.add("show");

  }


  function closeEditModal() {

    $("editModal").classList.remove("show");

  }


  async function saveProfile() {

    const name =
      clean($("editName").value);

    const avatar =
      clean($("editAvatar").value);


    if (!name) {

      showToast(
        "اكتب اسم المستخدم"
      );

      return;

    }


    try {

      const token =
        await currentUser.getIdToken();


      const response =
        await fetch(
          API_BASE + "/api/users/profile",
          {

            method: "PATCH",

            headers: {

              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " + token

            },

            body: JSON.stringify({

              name: name,

              avatar: avatar

            })

          }
        );


      /*
       * لو السيرفر عنده route التعديل
       */

      if (!response.ok) {

        throw new Error(
          "فشل حفظ البيانات"
        );

      }


      /*
       * تحديث Firebase أيضاً
       */

      try {

        await currentUser.updateProfile({

          displayName: name,

          photoURL:
            avatar || null

        });

      } catch (firebaseError) {

        console.warn(
          firebaseError
        );

      }


      userData.name = name;

      userData.avatar = avatar;


      renderAccount();

      closeEditModal();

      showToast(
        "تم حفظ البيانات بنجاح ✅"
      );


    } catch (error) {

      console.error(error);

      /*
       * لو route التعديل لسه مش موجود
       * نوضح للمستخدم بدلاً من عمل تحديث وهمي.
       */

      showToast(
        "تعديل الحساب يحتاج تفعيل API في السيرفر"
      );

    }

  }


  /* =========================
     CHANGE PASSWORD
  ========================= */

  async function changePassword() {

    if (!currentUser.email) {

      showToast(
        "الحساب لا يحتوي على بريد إلكتروني"
      );

      return;

    }


    try {

      await auth.sendPasswordResetEmail(
        currentUser.email
      );

      showToast(
        "تم إرسال رابط تغيير كلمة المرور إلى بريدك 📧"
      );

    } catch (error) {

      console.error(error);

      showToast(
        "تعذر إرسال رابط تغيير كلمة المرور"
      );

    }

  }


  /* =========================
     COPY ID
  ========================= */

  async function copyUserId() {

    const id =
      $("infoId").textContent;


    if (!id || id === "-") {

      return;

    }


    try {

      await navigator.clipboard.writeText(
        id
      );

      showToast(
        "تم نسخ ID الحساب ✅"
      );

    } catch (error) {

      showToast(
        "لم أستطع نسخ الـID"
      );

    }

  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    try {

      await auth.signOut();

      window.location.href =
        "login.html";

    } catch (error) {

      console.error(error);

      showToast(
        "حدث خطأ أثناء تسجيل الخروج"
      );

    }

  }


  /* =========================
     BACK
  ========================= */

  function goBack() {

    if (
      document.referrer &&
      document.referrer !==
      window.location.href
    ) {

      history.back();

    } else {

      window.location.href =
        "home.html";

    }

  }


  /* =========================
     CLOSE MODAL
  ========================= */

  $("editModal").addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeEditModal();

      }

    }
  );

</script>

</body>
