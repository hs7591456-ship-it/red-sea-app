<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الحساب - Red Sea</title>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, Tahoma, sans-serif;
}

body{
    background:#071018;
    color:#fff;
    min-height:100vh;
}

button{
    font-family:inherit;
}

.page{
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    padding-bottom:90px;
}

/* TOP */
.top{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:#09151e;
    position:sticky;
    top:0;
    z-index:20;
}

.top-title{
    font-size:21px;
    font-weight:bold;
}

.back{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#12232e;
    color:white;
    font-size:22px;
    cursor:pointer;
}

/* LOADING */
#loading{
    min-height:70vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:15px;
    color:#b8c5cc;
}

.spinner{
    width:40px;
    height:40px;
    border:4px solid #19313e;
    border-top-color:#00b7ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* CONTENT */
#content{
    display:none;
}

.profile-head{
    text-align:center;
    padding:30px 20px 22px;
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#102633;
    border:3px solid #00aeea;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:43px;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    margin-top:14px;
    font-size:24px;
    font-weight:bold;
}

.profile-id{
    margin-top:7px;
    color:#81929c;
    font-size:14px;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:0 15px 18px;
}

.stat{
    background:#0d1d27;
    border:1px solid rgba(255,255,255,.06);
    border-radius:15px;
    padding:15px 5px;
    text-align:center;
}

.stat-number{
    font-size:20px;
    font-weight:bold;
    color:#00b7ff;
}

.stat-title{
    color:#91a0a8;
    font-size:12px;
    margin-top:5px;
}

/* CARD */
.card{
    margin:0 15px 15px;
    background:#0d1d27;
    border:1px solid rgba(255,255,255,.06);
    border-radius:18px;
    overflow:hidden;
}

.card-title{
    padding:17px;
    font-size:17px;
    font-weight:bold;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.info-row{
    min-height:58px;
    padding:12px 17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.info-row:last-child{
    border-bottom:0;
}

.info-label{
    color:#899aa4;
    font-size:14px;
}

.info-value{
    font-size:14px;
    text-align:left;
    direction:rtl;
    max-width:65%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* BUTTONS */
.actions{
    padding:0 15px;
}

.action-btn{
    width:100%;
    min-height:52px;
    margin-bottom:10px;
    border:0;
    border-radius:15px;
    background:#102733;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.action-btn:active{
    transform:scale(.98);
}

.action-primary{
    background:#008dcc;
}

.action-danger{
    background:#38171b;
    color:#ff8585;
}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:600px;
    height:72px;
    background:#09151e;
    border-top:1px solid rgba(255,255,255,.08);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    z-index:30;
}

.nav{
    background:none;
    border:0;
    color:#72838d;
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:5px;
}

.nav span{
    font-size:22px;
}

.nav.active{
    color:#00b7ff;
}

/* TOAST */
#toast{
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#142b37;
    color:#fff;
    padding:13px 20px;
    border-radius:13px;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:100;
    max-width:90%;
    text-align:center;
    font-size:14px;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal-box{
    width:100%;
    max-width:500px;
    background:#0c1b24;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:20px;
}

.modal-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.input{
    width:100%;
    height:52px;
    border:1px solid #203844;
    background:#09151e;
    color:white;
    border-radius:13px;
    padding:0 15px;
    outline:none;
    margin-bottom:12px;
    font-size:15px;
}

.input:focus{
    border-color:#00aeea;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.modal-btn{
    height:50px;
    border:0;
    border-radius:13px;
    cursor:pointer;
    color:white;
    background:#18313d;
    font-size:15px;
}

.modal-save{
    background:#008dcc;
}
</style>
</head>

<body>

<div class="page">

    <!-- TOP -->
    <div class="top">
        <button class="back" onclick="goBack()">→</button>
        <div class="top-title">الحساب</div>
        <div style="width:42px;"></div>
    </div>

    <!-- LOADING -->
    <div id="loading">
        <div class="spinner"></div>
        <div>جاري تحميل الحساب...</div>
    </div>

    <!-- CONTENT -->
    <div id="content">

        <div class="profile-head">

            <div class="avatar" id="avatar">
                👤
            </div>

            <div class="profile-name" id="userName">
                المستخدم
            </div>

            <div class="profile-id" id="userId">
                ID: -
            </div>

        </div>

        <!-- STATS -->
        <div class="stats">

            <div class="stat">
                <div class="stat-number" id="coins">0</div>
                <div class="stat-title">العملات</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="followers">0</div>
                <div class="stat-title">المتابعين</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="following">0</div>
                <div class="stat-title">المتابَعين</div>
            </div>

        </div>

        <!-- INFORMATION -->
        <div class="card">

            <div class="card-title">
                معلومات الحساب
            </div>

            <div class="info-row">
                <div class="info-label">الاسم</div>
                <div class="info-value" id="infoName">-</div>
            </div>

            <div class="info-row">
                <div class="info-label">البريد الإلكتروني</div>
                <div class="info-value" id="infoEmail">-</div>
            </div>

            <div class="info-row">
                <div class="info-label">رقم المستخدم</div>
                <div class="info-value" id="infoId">-</div>
            </div>

            <div class="info-row">
                <div class="info-label">الوكالة</div>
                <div class="info-value" id="infoAgency">بدون وكالة</div>
            </div>

        </div>

        <!-- ACTIONS -->
        <div class="actions">

            <button class="action-btn action-primary" onclick="openEdit()">
                ✏️ تعديل الحساب
            </button>

            <button class="action-btn" onclick="changePassword()">
                🔐 تغيير كلمة المرور
            </button>

            <button class="action-btn" onclick="copyUserId()">
                📋 نسخ ID
            </button>

            <button class="action-btn action-danger" onclick="logout()">
                🚪 تسجيل الخروج
            </button>

        </div>

    </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

    <button class="nav" onclick="go('home.html')">
        <span>🏠</span>
        الرئيسية
    </button>

    <button class="nav" onclick="go('messages.html')">
        <span>💬</span>
        الرسائل
    </button>

    <button class="nav active">
        <span>👤</span>
        الحساب
    </button>

</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">

    <div class="modal-box">

        <div class="modal-title">
            تعديل الحساب
        </div>

        <input
            id="editName"
            class="input"
            type="text"
            placeholder="الاسم"
        >

        <input
            id="editAvatar"
            class="input"
            type="text"
            placeholder="رابط صورة الحساب"
            dir="ltr"
        >

        <div class="modal-actions">

            <button class="modal-btn" onclick="closeEdit()">
                إلغاء
            </button>

            <button class="modal-btn modal-save" onclick="saveProfile()">
                حفظ
            </button>

        </div>

    </div>

</div>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyD_R-LAa0qHFLSFI7QX7JmCLnh2DJyZhM",
    authDomain: "red-sea-8db76.firebaseapp.com",
    projectId: "red-sea-8db76",
    storageBucket: "red-sea-8db76.firebasestorage.app",
    messagingSenderId: "418468623324",
    appId: "1:418468623324:web:2a5fd96f353efccaf81519"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();

const API_BASE = "https://red-sea-server.onrender.com";

/* =========================
   VARIABLES
========================= */

let currentFirebaseUser = null;
let currentUser = null;
let authChecked = false;

/* =========================
   NAVIGATION
========================= */

function go(page){

    window.location.href = page;

}

function goBack(){

    if(document.referrer && document.referrer !== window.location.href){

        history.back();

    }else{

        window.location.href = "home.html";

    }

}

/* =========================
   TOAST
========================= */

function showToast(message){

    const toast = document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(function(){

        toast.classList.remove("show");

    },3000);

}

/* =========================
   LOADING
========================= */

function showLoading(){

    document.getElementById("loading").style.display = "flex";

    document.getElementById("content").style.display = "none";

}

function showContent(){

    document.getElementById("loading").style.display = "none";

    document.getElementById("content").style.display = "block";

}

/* =========================
   LOAD ACCOUNT
========================= */

async function loadAccount(firebaseUser){

    try{

        currentFirebaseUser = firebaseUser;

        const uid = firebaseUser.uid;

        const token = await firebaseUser.getIdToken(true);

        const response = await fetch(
            API_BASE + "/api/users/by-firebase/" + encodeURIComponent(uid),
            {
                method:"GET",
                headers:{
                    "Authorization":"Bearer " + token,
                    "Accept":"application/json"
                }
            }
        );

        if(!response.ok){

            throw new Error("SERVER_" + response.status);

        }

        const data = await response.json();

        /*
         * السيرفر ممكن يرجع:
         * { user: {...} }
         *
         * أو يرجع:
         * {...}
         */

        currentUser = data.user || data;

        if(!currentUser){

            throw new Error("USER_NOT_FOUND");

        }

        renderAccount(firebaseUser,currentUser);

        showContent();

    }catch(error){

        console.error("ACCOUNT ERROR:",error);

        /*
         * مهم:
         * ما نرجعش المستخدم لتسجيل الدخول لمجرد
         * إن API حصل فيه خطأ.
         */

        showContent();

        showToast("تعذر تحميل بعض بيانات الحساب");

        /*
         * نعرض بيانات Firebase الأساسية
         * حتى لو السيرفر لم يرجع بيانات المستخدم.
         */

        renderBasicFirebaseAccount(firebaseUser);

    }

}

/* =========================
   BASIC FIREBASE ACCOUNT
========================= */

function renderBasicFirebaseAccount(firebaseUser){

    const name =
        firebaseUser.displayName ||
        "المستخدم";

    const email =
        firebaseUser.email ||
        "-";

    document.getElementById("userName").textContent = name;

    document.getElementById("userId").textContent =
        "ID: " + firebaseUser.uid;

    document.getElementById("infoName").textContent = name;

    document.getElementById("infoEmail").textContent = email;

    document.getElementById("infoId").textContent =
        firebaseUser.uid;

    document.getElementById("infoAgency").textContent =
        "بدون وكالة";

    document.getElementById("coins").textContent = "0";

    document.getElementById("followers").textContent = "0";

    document.getElementById("following").textContent = "0";

    if(firebaseUser.photoURL){

        document.getElementById("avatar").innerHTML =
            '<img src="' +
            escapeAttribute(firebaseUser.photoURL) +
            '" onerror="this.parentElement.innerHTML=\'👤\'">';

    }

}

/* =========================
   RENDER ACCOUNT
========================= */

function renderAccount(firebaseUser,user){

    const name =
        user.name ||
        user.displayName ||
        firebaseUser.displayName ||
        "المستخدم";

    const email =
        user.email ||
        firebaseUser.email ||
        "-";

    const uid =
        user.userId ||
        user.id ||
        user.firebaseUid ||
        firebaseUser.uid;

    const agency =
        user.agencyName ||
        user.agency ||
        user.agencyId ||
        "بدون وكالة";

    const coins =
        user.coins ??
        user.balance ??
        0;

    const followers =
        user.followers ??
        0;

    const following =
        user.following ??
        0;

    const avatar =
        user.avatar ||
        user.photoURL ||
        firebaseUser.photoURL ||
        "";

    document.getElementById("userName").textContent = name;

    document.getElementById("userId").textContent =
        "ID: " + uid;

    document.getElementById("infoName").textContent =
        name;

    document.getElementById("infoEmail").textContent =
        email;

    document.getElementById("infoId").textContent =
        uid;

    document.getElementById("infoAgency").textContent =
        agency;

    document.getElementById("coins").textContent =
        formatNumber(coins);

    document.getElementById("followers").textContent =
        formatNumber(followers);

    document.getElementById("following").textContent =
        formatNumber(following);

    if(avatar){

        document.getElementById("avatar").innerHTML =
            '<img src="' +
            escapeAttribute(avatar) +
            '" onerror="this.parentElement.innerHTML=\'👤\'">';

    }else{

        document.getElementById("avatar").innerHTML = "👤";

    }

}

/* =========================
   NUMBER
========================= */

function formatNumber(value){

    const number = Number(value);

    if(!Number.isFinite(number)){

        return "0";

    }

    return number.toLocaleString("ar-EG");

}

/* =========================
   ESCAPE
========================= */

function escapeAttribute(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}

/* =========================
   EDIT
========================= */

function openEdit(){

    if(!currentFirebaseUser){

        showToast("بيانات الحساب لم تكتمل بعد");

        return;

    }

    const name =
        currentUser?.name ||
        currentUser?.displayName ||
        currentFirebaseUser.displayName ||
        "";

    const avatar =
        currentUser?.avatar ||
        currentUser?.photoURL ||
        currentFirebaseUser.photoURL ||
        "";

    document.getElementById("editName").value = name;

    document.getElementById("editAvatar").value = avatar;

    document.getElementById("editModal").style.display =
        "flex";

}

function closeEdit(){

    document.getElementById("editModal").style.display =
        "none";

}

/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

    if(!currentFirebaseUser){

        showToast("المستخدم غير مسجل الدخول");

        return;

    }

    const name =
        document.getElementById("editName").value.trim();

    const avatar =
        document.getElementById("editAvatar").value.trim();

    if(!name){

        showToast("اكتب اسم المستخدم");

        return;

    }

    try{

        /*
         * تحديث Firebase
         */

        await currentFirebaseUser.updateProfile({

            displayName:name,

            photoURL:avatar || null

        });

        /*
         * محاولة تحديث السيرفر
         */

        try{

            const token =
                await currentFirebaseUser.getIdToken();

            const response = await fetch(
                API_BASE + "/api/users/profile",
                {
                    method:"PATCH",
                    headers:{
                        "Authorization":"Bearer " + token,
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        name:name,
                        avatar:avatar
                    })
                }
            );

            if(response.ok){

                const result = await response.json();

                if(result.user){

                    currentUser = result.user;

                }

            }

        }catch(serverError){

            console.log(
                "Profile server update skipped:",
                serverError
            );

        }

        /*
         * تحديث الشاشة مباشرة
         */

        document.getElementById("userName").textContent =
            name;

        document.getElementById("infoName").textContent =
            name;

        if(avatar){

            document.getElementById("avatar").innerHTML =
                '<img src="' +
                escapeAttribute(avatar) +
                '" onerror="this.parentElement.innerHTML=\'👤\'">';

        }else{

            document.getElementById("avatar").innerHTML =
                "👤";

        }

        if(currentUser){

            currentUser.name = name;
            currentUser.avatar = avatar;

        }

        closeEdit();

        showToast("تم تحديث الحساب بنجاح");

    }catch(error){

        console.error(error);

        showToast("حدث خطأ أثناء تحديث الحساب");

    }

}

/* =========================
   COPY ID
========================= */

async function copyUserId(){

    if(!currentFirebaseUser){

        showToast("لم يتم تحميل الحساب");

        return;

    }

    const id =
        currentUser?.userId ||
        currentUser?.id ||
        currentFirebaseUser.uid;

    try{

        await navigator.clipboard.writeText(id);

        showToast("تم نسخ ID");

    }catch(error){

        showToast("تعذر نسخ ID");

    }

}

/* =========================
   CHANGE PASSWORD
========================= */

async function changePassword(){

    if(!currentFirebaseUser){

        showToast("المستخدم غير مسجل الدخول");

        return;

    }

    const email = currentFirebaseUser.email;

    if(!email){

        showToast("الحساب لا يحتوي على بريد إلكتروني");

        return;

    }

    try{

        await auth.sendPasswordResetEmail(email);

        showToast(
            "تم إرسال رابط تغيير كلمة المرور إلى بريدك"
        );

    }catch(error){

        console.error(error);

        if(error.code === "auth/too-many-requests"){

            showToast("حاول مرة أخرى بعد قليل");

        }else{

            showToast(
                "تعذر إرسال رابط تغيير كلمة المرور"
            );

        }

    }

}

/* =========================
   LOGOUT
========================= */

async function logout(){

    try{

        await auth.signOut();

        window.location.href = "login.html";

    }catch(error){

        console.error(error);

        showToast("تعذر تسجيل الخروج");

    }

}

/* =========================
   AUTH STATE
========================= */

showLoading();

auth.onAuthStateChanged(function(user){

    /*
     * Firebase استجاب الآن.
     * من هنا فقط نقرر هل المستخدم داخل أم لا.
     */

    if(authChecked){

        return;

    }

    authChecked = true;

    if(user){

        /*
         * المستخدم مسجل الدخول.
         * لا نرسله لتسجيل الدخول.
         */

        loadAccount(user);

    }else{

        /*
         * مفيش مستخدم مسجل فعلاً.
         */

        window.location.replace("login.html");

    }

});

/* =========================
   CLOSE MODAL
========================= */

document.getElementById("editModal").addEventListener(
    "click",
    function(event){

        if(event.target === this){

            closeEdit();

        }

    }
);

</script>

</body>
</html>
