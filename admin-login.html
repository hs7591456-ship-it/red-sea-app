<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Sea - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #17345c 0%, #081321 45%, #03080f 100%);
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: rgba(10, 23, 40, 0.94);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;
            border-radius: 24px;
            object-fit: cover;
            display: block;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .subtitle {
            text-align: center;
            color: #8ea5bf;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c9d7e8;
            font-size: 14px;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid #263b55;
            background: #07111e;
            color: white;
            border-radius: 14px;
            padding: 0 16px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2878ff;
            box-shadow: 0 0 0 3px rgba(40,120,255,0.12);
        }

        button {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #2878ff, #1252c7);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            background: rgba(220, 50, 50, 0.12);
            color: #ff8585;
            border: 1px solid rgba(255,80,80,0.15);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #60758d;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <img
        src="logo.png"
        class="logo"
        alt="Red Sea"
        onerror="this.style.display='none'"
    >

    <div class="title">RED SEA</div>

    <div class="subtitle">
        لوحة الإدارة
    </div>

    <form id="loginForm">

        <div class="input-group">
            <label for="username">اسم المستخدم</label>

            <input
                id="username"
                type="text"
                autocomplete="username"
                placeholder="اكتب اسم المستخدم"
                required
            >
        </div>

        <div class="input-group">
            <label for="password">كلمة المرور</label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="اكتب كلمة المرور"
                required
            >
        </div>

        <button id="loginButton" type="submit">
            دخول لوحة الإدارة
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="footer">
        Red Sea Administration
    </div>

</div>

<script>

const API_BASE = "https://red-sea-server.onrender.com";

const loginForm = document.getElementById("loginForm");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text) {
    message.textContent = text;
    message.style.display = "block";
}

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username || !password) {
        showMessage("اكتب اسم المستخدم وكلمة المرور");
        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "جاري تسجيل الدخول...";
    message.style.display = "none";

    try {

        const response = await fetch(
            API_BASE + "/api/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "اسم المستخدم أو كلمة المرور غير صحيحة"
            );
        }

        if (!data.token) {
            throw new Error("السيرفر لم يرجع جلسة الإدارة");
        }

        localStorage.setItem(
            "redsea_admin_token",
            data.token
        );

        localStorage.setItem(
            "redsea_admin_user",
            JSON.stringify(data.admin || {})
        );

        window.location.href = "admin.html";

    } catch (error) {

        console.error(error);

        showMessage(
            error.message || "حدث خطأ أثناء تسجيل الدخول"
        );

        loginButton.disabled = false;
        loginButton.textContent = "دخول لوحة الإدارة";
    }

});

</script>

</body>
</html>
