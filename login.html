<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020b18"
    >

    <title>Red Sea - تسجيل الدخول</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Tahoma,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    #07538d 0%,
                    #042c4d 28%,
                    #021426 62%,
                    #010811 100%
                );

            overflow-x: hidden;

        }


        body::before {

            content: "";

            position: fixed;

            width: 280px;

            height: 280px;

            border-radius: 50%;

            background:
                rgba(0,150,255,.12);

            filter: blur(70px);

            top: -100px;

            left: -80px;

            pointer-events: none;

        }


        body::after {

            content: "";

            position: fixed;

            width: 250px;

            height: 250px;

            border-radius: 50%;

            background:
                rgba(0,85,180,.10);

            filter: blur(70px);

            bottom: -100px;

            right: -80px;

            pointer-events: none;

        }


        button,
        input {
            font-family: inherit;
        }


        /* ===============================
           PAGE
        =============================== */

        .page {

            min-height: 100vh;

            width: 100%;

            max-width: 600px;

            margin: auto;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding:
                35px
                22px
                25px;

        }


        /* ===============================
           LOGO
        =============================== */

        .logo-container {

            width: 100%;

            display: flex;

            justify-content: center;

            margin-bottom: 18px;

        }


        .logo {

            width:
                min(65vw, 280px);

            max-height: 180px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 16px
                    rgba(0,160,255,.40)
                );

            animation:
                logoFloat 3s
                ease-in-out
                infinite;

        }


        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

        }


        /* ===============================
           TITLE
        =============================== */

        .title {

            text-align: center;

            margin-bottom: 25px;

        }


        .title h1 {

            font-size: 24px;

            font-weight: 900;

            margin-bottom: 7px;

        }


        .title p {

            font-size: 11px;

            color:
                rgba(255,255,255,.45);

        }


        /* ===============================
           CARD
        =============================== */

        .card {

            width: 100%;

            padding: 23px 19px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(8,48,78,.78),
                    rgba(2,20,37,.88)
                );

            border:
                1px solid
                rgba(255,255,255,.08);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.32);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

        }


        /* ===============================
           INPUT GROUP
        =============================== */

        .input-group {

            margin-bottom: 16px;

        }


        .label {

            display: block;

            font-size: 11px;

            font-weight: 700;

            color:
                rgba(255,255,255,.65);

            margin-bottom: 8px;

        }


        .input-wrap {

            width: 100%;

            height: 52px;

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                0
                14px;

            border-radius: 15px;

            background:
                rgba(255,255,255,.045);

            border:
                1px solid
                rgba(255,255,255,.075);

            transition:
                .2s;

        }


        .input-wrap:focus-within {

            border-color:
                rgba(22,174,255,.65);

            box-shadow:
                0 0 0 3px
                rgba(0,150,255,.08);

            background:
                rgba(0,130,220,.06);

        }


        .input-icon {

            width: 23px;

            flex-shrink: 0;

            text-align: center;

            font-size: 17px;

            opacity: .65;

        }


        .input-wrap input {

            flex: 1;

            min-width: 0;

            height: 100%;

            border: none;

            outline: none;

            background: transparent;

            color: #fff;

            font-size: 13px;

            direction: ltr;

            text-align: left;

        }


        .input-wrap input::placeholder {

            color:
                rgba(255,255,255,.28);

        }


        .show-password {

            width: 30px;

            height: 30px;

            border: none;

            background: transparent;

            color:
                rgba(255,255,255,.55);

            font-size: 17px;

            cursor: pointer;

        }


        /* ===============================
           OPTIONS
        =============================== */

        .options {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin:
                2px
                2px
                19px;

        }


        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color:
                rgba(255,255,255,.48);

            font-size: 10px;

            cursor: pointer;

        }


        .remember input {

            accent-color: #08aaff;

            width: 14px;

            height: 14px;

        }


        .forgot {

            border: none;

            background: transparent;

            color: #28b7ff;

            font-size: 10px;

            cursor: pointer;

        }


        /* ===============================
           LOGIN BUTTON
        =============================== */

        .login-btn {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #09adff,
                    #0066df
                );

            color: #fff;

            font-size: 14px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 10px 25px
                rgba(0,120,255,.22);

            transition:
                .2s;

        }


        .login-btn:active {

            transform:
                scale(.98);

        }


        .login-btn:disabled {

            opacity: .55;

            cursor: not-allowed;

        }


        /* ===============================
           MESSAGE
        =============================== */

        .message {

            min-height: 18px;

            text-align: center;

            font-size: 11px;

            margin-top: 12px;

            color: #ff7187;

        }


        .message.success {

            color: #50e6a5;

        }


        /* ===============================
           DIVIDER
        =============================== */

        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin:
                20px
                0;

            color:
                rgba(255,255,255,.28);

            font-size: 10px;

        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            flex: 1;

            background:
                rgba(255,255,255,.08);

        }


        /* ===============================
           REGISTER
        =============================== */

        .register-btn {

            width: 100%;

            height: 50px;

            border-radius: 15px;

            border:
                1px solid
                rgba(34,180,255,.35);

            background:
                rgba(0,145,255,.07);

            color: #36bfff;

            font-size: 13px;

            font-weight: 800;

            cursor: pointer;

            transition: .2s;

        }


        .register-btn:active {

            transform:
                scale(.98);

        }


        /* ===============================
           FOOTER
        =============================== */

        .footer {

            margin-top: 22px;

            text-align: center;

            color:
                rgba(255,255,255,.25);

            font-size: 9px;

        }


        .footer strong {

            color:
                rgba(46,183,255,.55);

        }


        /* ===============================
           LOADING
        =============================== */

        .loading {

            display: inline-block;

            width: 17px;

            height: 17px;

            border-radius: 50%;

            border:
                2px solid
                rgba(255,255,255,.25);

            border-top-color: #fff;

            animation:
                spin .7s
                linear infinite;

            vertical-align: middle;

            margin-left: 7px;

        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* ===============================
           RESPONSIVE
        =============================== */

        @media (max-height: 700px) {

            .page {

                padding-top: 20px;

            }

            .logo {

                width: 210px;

            }

            .title {

                margin-bottom: 17px;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- LOGO -->

    <div class="logo-container">

        <img
            src="logo.png"
            class="logo"
            alt="Red Sea"
        >

    </div>


    <!-- TITLE -->

    <div class="title">

        <h1>
            تسجيل الدخول
        </h1>

        <p>
            ادخل إلى عالم Red Sea
        </p>

    </div>


    <!-- CARD -->

    <main class="card">


        <!-- EMAIL -->

        <div class="input-group">

            <label
                class="label"
                for="email"
            >
                البريد الإلكتروني
            </label>


            <div class="input-wrap">

                <span class="input-icon">
                    ✉️
                </span>


                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                >

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label
                class="label"
                for="password"
            >
                كلمة المرور
            </label>


            <div class="input-wrap">

                <span class="input-icon">
                    🔒
                </span>


                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                >


                <button
                    type="button"
                    class="show-password"
                    id="showPassword"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- OPTIONS -->

        <div class="options">


            <label class="remember">

                <input
                    type="checkbox"
                    id="remember"
                >

                تذكرني

            </label>


            <button
                type="button"
                class="forgot"
                id="forgotPassword"
            >
                نسيت كلمة المرور؟
            </button>


        </div>


        <!-- LOGIN -->

        <button
            type="button"
            class="login-btn"
            id="loginBtn"
        >
            تسجيل الدخول
        </button>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message"
        ></div>


        <!-- DIVIDER -->

        <div class="divider">

            أو

        </div>


        <!-- REGISTER -->

        <button
            type="button"
            class="register-btn"
            id="registerBtn"
        >
            إنشاء حساب جديد

        </button>


    </main>


    <!-- FOOTER -->

    <div class="footer">

        RED SEA

        <br>

        <strong>
            VOICE • CHAT • FRIENDS • GAMES • GIFTS
        </strong>

    </div>


</div>



<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">


    import {
        initializeApp
    } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        setPersistence,
        browserLocalPersistence,
        browserSessionPersistence,
        sendPasswordResetEmail
    } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    /* =========================================
       FIREBASE CONFIG
    ========================================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyD_R-LAa0qHFLS36qXJ7mZbCLnh2DJyZhM",

        authDomain:
            "red-sea-8db76.firebaseapp.com",

        projectId:
            "red-sea-8db76",

        storageBucket:
            "red-sea-8db76.firebasestorage.app",

        messagingSenderId:
            "418468623324",

        appId:
            "1:418468623324:web:2a5fd96f353efccaf81519"

    };


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    /* =========================================
       ELEMENTS
    ========================================= */

    const emailInput =
        document.getElementById(
            "email"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const rememberInput =
        document.getElementById(
            "remember"
        );


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    const registerBtn =
        document.getElementById(
            "registerBtn"
        );


    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );


    const showPassword =
        document.getElementById(
            "showPassword"
        );


    const message =
        document.getElementById(
            "message"
        );


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(
        text,
        success = false
    ) {

        message.textContent =
            text;

        message.className =
            success
            ? "message success"
            : "message";

    }


    /* =========================================
       PASSWORD SHOW / HIDE
    ========================================= */

    showPassword.addEventListener(
        "click",
        function() {

            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

                showPassword.textContent =
                    "🙈";

            } else {

                passwordInput.type =
                    "password";

                showPassword.textContent =
                    "👁️";

            }

        }
    );


    /* =========================================
       REGISTER
    ========================================= */

    registerBtn.addEventListener(
        "click",
        function() {

            window.location.href =
                "register.html";

        }
    );


    /* =========================================
       LOGIN
    ========================================= */

    loginBtn.addEventListener(
        "click",
        async function() {

            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;


            if (!email) {

                showMessage(
                    "اكتب البريد الإلكتروني أولاً"
                );

                emailInput.focus();

                return;

            }


            if (!password) {

                showMessage(
                    "اكتب كلمة المرور أولاً"
                );

                passwordInput.focus();

                return;

            }


            loginBtn.disabled =
                true;


            loginBtn.innerHTML =
                'جاري تسجيل الدخول <span class="loading"></span>';


            try {


                /*
                 * اختيار طريقة حفظ تسجيل الدخول
                 */

                if (
                    rememberInput.checked
                ) {

                    await setPersistence(
                        auth,
                        browserLocalPersistence
                    );

                } else {

                    await setPersistence(
                        auth,
                        browserSessionPersistence
                    );

                }


                /*
                 * تسجيل الدخول في Firebase
                 */

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                showMessage(
                    "تم تسجيل الدخول بنجاح ✓",
                    true
                );


                /*
                 * الانتقال للصفحة الرئيسية
                 */

                setTimeout(
                    function() {

                        window.location.replace(
                            "home.html"
                        );

                    },
                    500
                );


            } catch (error) {


                console.error(
                    error
                );


                let text =
                    "حدث خطأ أثناء تسجيل الدخول";


                switch (
                    error.code
                ) {


                    case
                    "auth/invalid-credential":

                        text =
                            "البريد الإلكتروني أو كلمة المرور غير صحيحة";

                        break;


                    case
                    "auth/invalid-email":

                        text =
                            "البريد الإلكتروني غير صحيح";

                        break;


                    case
                    "auth/user-not-found":

                        text =
                            "لا يوجد حساب بهذا البريد الإلكتروني";

                        break;


                    case
                    "auth/wrong-password":

                        text =
                            "كلمة المرور غير صحيحة";

                        break;


                    case
                    "auth/too-many-requests":

                        text =
                            "تمت محاولات كثيرة، حاول مرة أخرى لاحقًا";

                        break;


                    case
                    "auth/network-request-failed":

                        text =
                            "تأكد من اتصال الإنترنت";

                        break;


                    case
                    "auth/user-disabled":

                        text =
                            "هذا الحساب تم تعطيله";

                        break;

                }


                showMessage(
                    text
                );


                loginBtn.disabled =
                    false;


                loginBtn.textContent =
                    "تسجيل الدخول";

            }

        }
    );


    /* =========================================
       FORGOT PASSWORD
    ========================================= */

    forgotPassword.addEventListener(
        "click",
        async function() {


            const email =
                emailInput.value.trim();


            if (!email) {

                showMessage(
                    "اكتب البريد الإلكتروني أولاً"
                );

                emailInput.focus();

                return;

            }


            try {


                await sendPasswordResetEmail(
                    auth,
                    email
                );


                showMessage(
                    "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني",
                    true
                );


            } catch (error) {


                console.error(
                    error
                );


                let text =
                    "تعذر إرسال رابط إعادة التعيين";


                if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    text =
                        "لا يوجد حساب بهذا البريد الإلكتروني";

                }


                if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    text =
                        "البريد الإلكتروني غير صحيح";

                }


                showMessage(
                    text
                );

            }

        }
    );


    /* =========================================
       ENTER KEY
    ========================================= */

    passwordInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                loginBtn.click();

            }

        }
    );


    emailInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                passwordInput.focus();

            }

        }
    );


    /* =========================================
       CHECK CURRENT USER
    ========================================= */

    onAuthStateChanged(
        auth,
        function(user) {

            /*
             * لو المستخدم بالفعل مسجل دخول،
             * ندخله مباشرة للرئيسية.
             */

            if (user) {

                window.location.replace(
                    "home.html"
                );

            }

        }
    );


</script>


</body>

    </html>
