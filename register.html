<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#03182f">

    <title>Red Sea - إنشاء حساب</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            color: #fff;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    #073d70 0%,
                    #031d38 38%,
                    #010914 100%
                );
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .page {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 25px 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .glow {
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: rgba(0, 150, 255, 0.12);
            filter: blur(70px);
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .logo-box {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .logo {
            width: min(48vw, 190px);
            height: auto;
            filter:
                drop-shadow(0 0 12px rgba(0, 170, 255, .35))
                drop-shadow(0 0 28px rgba(0, 110, 255, .18));
        }

        .title {
            text-align: center;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        .title h1 {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .title p {
            font-size: 13px;
            color: rgba(255, 255, 255, .62);
        }

        .card {
            width: 100%;
            padding: 20px 18px;
            border-radius: 24px;
            background: rgba(3, 18, 35, .72);
            border: 1px solid rgba(255, 255, 255, .08);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, .35),
                inset 0 1px 0 rgba(255, 255, 255, .04);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            position: relative;
            z-index: 1;
        }

        .field {
            margin-bottom: 13px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: rgba(255, 255, 255, .75);
        }

        .input-wrap {
            position: relative;
        }

        .icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            opacity: .62;
            pointer-events: none;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 15px;
            outline: none;
            background: rgba(255, 255, 255, .055);
            color: #fff;
            padding: 0 46px 0 15px;
            font-size: 14px;
            transition: .25s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, .33);
        }

        input:focus {
            border-color: rgba(0, 170, 255, .65);
            background: rgba(255, 255, 255, .075);
            box-shadow: 0 0 0 3px rgba(0, 150, 255, .10);
        }

        .password-input {
            padding-left: 47px;
        }

        .show-password {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: rgba(255, 255, 255, .55);
            font-size: 17px;
            cursor: pointer;
            padding: 5px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 5px 2px 17px;
            color: rgba(255, 255, 255, .52);
            font-size: 11px;
            line-height: 1.6;
            cursor: pointer;
        }

        .terms input {
            width: 16px;
            height: 16px;
            margin-top: 2px;
            padding: 0;
            flex-shrink: 0;
            accent-color: #00aaff;
        }

        .terms a {
            color: #42c5ff;
            text-decoration: none;
        }

        .register-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(
                135deg,
                #008cff,
                #0059d9
            );
            box-shadow:
                0 10px 25px rgba(0, 119, 255, .28),
                inset 0 1px 0 rgba(255, 255, 255, .18);
            transition: .2s;
        }

        .register-btn:active {
            transform: scale(.98);
        }

        .register-btn:disabled {
            opacity: .65;
            cursor: wait;
        }

        .message {
            display: none;
            margin-top: 13px;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
        }

        .back {
            width: 100%;
            height: 49px;
            margin-top: 13px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, .10);
            background: rgba(255, 255, 255, .035);
            color: rgba(255, 255, 255, .72);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .back:active {
            transform: scale(.98);
            background: rgba(255, 255, 255, .07);
        }

        .footer {
            text-align: center;
            margin-top: 17px;
            color: rgba(255, 255, 255, .28);
            font-size: 10px;
            position: relative;
            z-index: 1;
        }

        @media (max-height: 700px) {

            .page {
                padding-top: 12px;
                padding-bottom: 12px;
            }

            .logo {
                width: 125px;
            }

            .logo-box {
                margin-bottom: 8px;
            }

            .title {
                margin-bottom: 10px;
            }

            .title h1 {
                font-size: 22px;
            }

            .card {
                padding: 15px 17px;
            }

            .field {
                margin-bottom: 9px;
            }

            input {
                height: 47px;
            }

            .register-btn {
                height: 49px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="glow"></div>

    <div class="logo-box">
        <img
            src="logo.png"
            class="logo"
            alt="Red Sea"
        >
    </div>

    <div class="title">
        <h1>إنشاء حساب جديد</h1>

        <p>
            انضم إلى عالم Red Sea
        </p>
    </div>

    <div class="card">

        <form id="registerForm">

            <!-- اسم المستخدم -->
            <div class="field">

                <label for="name">
                    اسم المستخدم
                </label>

                <div class="input-wrap">

                    <span class="icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="name"
                        placeholder="اكتب اسمك"
                        autocomplete="name"
                        maxlength="30"
                        required
                    >

                </div>

            </div>


            <!-- البريد الإلكتروني -->
            <div class="field">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <div class="input-wrap">

                    <span class="icon">
                        ✉
                    </span>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- كلمة المرور -->
            <div class="field">

                <label for="password">
                    كلمة المرور
                </label>

                <div class="input-wrap">

                    <span class="icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="6 أحرف على الأقل"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- تأكيد كلمة المرور -->
            <div class="field">

                <label for="confirmPassword">
                    تأكيد كلمة المرور
                </label>

                <div class="input-wrap">

                    <span class="icon">
                        🔐
                    </span>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="password-input"
                        placeholder="أعد كتابة كلمة المرور"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="confirmPassword"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- الشروط -->
            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                >

                <span>

                    أوافق على

                    <a
                        href="#"
                        onclick="event.preventDefault();"
                    >
                        شروط الاستخدام
                    </a>

                    و

                    <a
                        href="#"
                        onclick="event.preventDefault();"
                    >
                        سياسة الخصوصية
                    </a>

                </span>

            </label>


            <!-- زر التسجيل -->
            <button
                type="submit"
                class="register-btn"
                id="registerBtn"
            >
                إنشاء الحساب
            </button>


            <!-- الرسائل -->
            <div
                class="message"
                id="message"
            ></div>

        </form>


        <!-- زر العودة -->
        <button
            type="button"
            class="back"
            id="backBtn"
        >
            العودة لتسجيل الدخول
        </button>

    </div>


    <div class="footer">

        RED SEA • VOICE ROOMS • CHAT • FRIENDS • GAMES • GIFTS

    </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    /* Firebase Configuration */

    const firebaseConfig = {

        apiKey:
            "AIzaSyD_R-LAa0qHFLS36qXJ7mZbCLnh2DJyZhM",

        authDomain:
            "red-sea-8db76.firebaseapp.com",

        projectId:
            "red-sea-8db76",

        storageBucket:
            "red-sea-8db76.firebasestorage.app",

        messagingSenderId:
            "418468623324",

        appId:
            "1:418468623324:web:2a5fd96f353efccaf81519"

    };


    /* تشغيل Firebase */

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    /* عناصر الصفحة */

    const form =
        document.getElementById(
            "registerForm"
        );

    const message =
        document.getElementById(
            "message"
        );

    const registerBtn =
        document.getElementById(
            "registerBtn"
        );

    const backBtn =
        document.getElementById(
            "backBtn"
        );


    /* رسالة */

    function showMessage(
        text,
        success = false
    ) {

        message.style.display =
            "block";

        message.textContent =
            text;


        if (success) {

            message.style.background =
                "rgba(0, 200, 120, .15)";

            message.style.color =
                "#5dffbd";

        } else {

            message.style.background =
                "rgba(255, 70, 70, .15)";

            message.style.color =
                "#ff8b8b";

        }

    }


    /* تسجيل الحساب */

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            const terms =
                document
                    .getElementById("terms")
                    .checked;


            /* التحقق من الاسم */

            if (!name) {

                showMessage(
                    "اكتب اسم المستخدم"
                );

                return;
            }


            /* التحقق من البريد */

            if (!email) {

                showMessage(
                    "اكتب البريد الإلكتروني"
                );

                return;
            }


            /* التحقق من كلمة المرور */

            if (password.length < 6) {

                showMessage(
                    "كلمة المرور لازم تكون 6 أحرف على الأقل"
                );

                return;
            }


            /* مطابقة كلمة المرور */

            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "كلمتا المرور غير متطابقتين"
                );

                return;
            }


            /* الشروط */

            if (!terms) {

                showMessage(
                    "لازم توافق على شروط الاستخدام وسياسة الخصوصية"
                );

                return;
            }


            /* تشغيل حالة التحميل */

            registerBtn.disabled =
                true;

            registerBtn.textContent =
                "جاري إنشاء الحساب...";


            try {

                /* إنشاء الحساب */

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                /* حفظ اسم المستخدم */

                await updateProfile(
                    user,
                    {
                        displayName:
                            name
                    }
                );


                /* نجاح */

                showMessage(
                    "تم إنشاء الحساب بنجاح 🎉",
                    true
                );


                registerBtn.textContent =
                    "تم إنشاء الحساب ✓";


                /* الذهاب للصفحة الرئيسية */

                setTimeout(
                    function() {

                        window.location.replace(
                            "home.html"
                        );

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    error
                );


                console.error(
                    "Firebase error code:",
                    error.code
                );


                let errorMessage =
                    "حدث خطأ أثناء إنشاء الحساب";


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    errorMessage =
                        "البريد الإلكتروني مستخدم بالفعل";


                } else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    errorMessage =
                        "البريد الإلكتروني غير صحيح";


                } else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    errorMessage =
                        "كلمة المرور ضعيفة";


                } else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    errorMessage =
                        "تأكد من اتصال الإنترنت";


                } else if (
                    error.code ===
                    "auth/operation-not-allowed"
                ) {

                    errorMessage =
                        "تسجيل البريد الإلكتروني غير مفعّل في Firebase";


                } else if (
                    error.code ===
                    "auth/api-key-not-valid"
                ) {

                    errorMessage =
                        "مفتاح Firebase غير صالح";


                } else if (
                    error.code ===
                    "auth/too-many-requests"
                ) {

                    errorMessage =
                        "تم إرسال طلبات كثيرة، حاول مرة أخرى لاحقًا";


                } else {

                    errorMessage =
                        "حدث خطأ أثناء إنشاء الحساب: " +
                        error.message;

                }


                showMessage(
                    errorMessage
                );


                registerBtn.disabled =
                    false;

                registerBtn.textContent =
                    "إنشاء الحساب";

            }

        }
    );


    /* =====================================================
       زر إظهار كلمة المرور
    ===================================================== */

    document
        .querySelectorAll(
            ".show-password"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();


                        const target =
                            document.getElementById(
                                button.getAttribute(
                                    "data-target"
                                )
                            );


                        if (
                            target.type ===
                            "password"
                        ) {

                            target.type =
                                "text";

                            button.textContent =
                                "🙈";

                        } else {

                            target.type =
                                "password";

                            button.textContent =
                                "👁";

                        }

                    }
                );

            }
        );


    /* =====================================================
       العودة لتسجيل الدخول
       
       هذا الزر مستقل عن Firebase.
       ===================================================== */

    backBtn.addEventListener(
        "click",
        function() {

            window.location.href =
                "./login.html";

        }
    );

</script>

</body>

    </html>
