<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#010812"
    >

    <title>Red Sea</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        body {

            background:
                radial-gradient(
                    circle at center,
                    #062d55 0%,
                    #03182f 42%,
                    #010812 100%
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Arial,
                sans-serif;

        }


        .splash {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            animation:
                showSplash .8s ease;

        }


        .logo {

            width:
                min(78vw, 360px);

            height: auto;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(0,150,255,.45)
                )
                drop-shadow(
                    0 0 35px
                    rgba(0,100,255,.2)
                );

            animation:
                logoAnimation 2.8s
                ease-in-out
                infinite;

        }


        .loading {

            margin-top: 22px;

            display: flex;

            align-items: center;

            gap: 7px;

        }


        .dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: #fff;

            opacity: .35;

            animation:
                dots 1.2s
                infinite
                ease-in-out;

        }


        .dot:nth-child(2) {

            animation-delay: .2s;

        }


        .dot:nth-child(3) {

            animation-delay: .4s;

        }


        @keyframes showSplash {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        @keyframes logoAnimation {

            0%,
            100% {
                transform: scale(.96);
            }

            50% {
                transform: scale(1.02);
            }

        }


        @keyframes dots {

            0%,
            100% {

                opacity: .25;

                transform:
                    translateY(0);

            }

            50% {

                opacity: 1;

                transform:
                    translateY(-4px);

            }

        }

    </style>

</head>


<body>


<main class="splash">

    <img
        class="logo"
        src="logo.png"
        alt="Red Sea"
    >

    <div class="loading">

        <span class="dot"></span>

        <span class="dot"></span>

        <span class="dot"></span>

    </div>

</main>



<script type="module">

    import {
        initializeApp
    } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    } from
        "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyD_R-LAa0qHFLS36qXJ7mZbCLnh2DJyZhM",

        authDomain:
            "red-sea-8db76.firebaseapp.com",

        projectId:
            "red-sea-8db76",

        storageBucket:
            "red-sea-8db76.firebasestorage.app",

        messagingSenderId:
            "418468623324",

        appId:
            "1:418468623324:web:2a5fd96f353efccaf81519"

    };


    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    let finished = false;


    function goToPage(user) {

        if (finished) {
            return;
        }

        finished = true;


        if (user) {

            window.location.replace(
                "home.html"
            );

        } else {

            window.location.replace(
                "login.html"
            );

        }

    }


    onAuthStateChanged(
        auth,
        function(user) {

            /*
             * نستنى Firebase يتأكد
             * من حالة تسجيل الدخول.
             */

            setTimeout(
                function() {

                    goToPage(user);

                },
                1800
            );

        }
    );

</script>


</body>

</html>
